<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 180" width="100%" height="100%">
  <defs>
    <filter id="subtle-shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- ISOTIPO: CASAS Y TRAZO VERDE -->
  <g id="isotipo" filter="url(#subtle-shadow)">
    
    <!-- Casa Posterior (Derecha) -->
    <!-- Techo Derecho -->
    <path d="M165 42 L205 18 L245 42 L230 52 L205 37 L180 52 Z" fill="#0072bc" />
    <!-- Ventana Derecha (4 cuadros) -->
    <g fill="#0072bc">
      <rect x="195" y="47" width="8" height="8" rx="0.5" />
      <rect x="206" y="47" width="8" height="8" rx="0.5" />
      <rect x="195" y="58" width="8" height="8" rx="0.5" />
      <rect x="206" y="58" width="8" height="8" rx="0.5" />
    </g>

    <!-- Casa Frontal (Izquierda) -->
    <!-- Techo Izquierdo Principal -->
    <path d="M45 102 L145 35 L200 72 L186 85 L145 56 L62 112 Z" fill="#0072bc" />
    
    <!-- Ventana Izquierda Grande (4 cuadros) -->
    <g fill="#0072bc">
      <rect x="120" y="72" width="16" height="16" rx="1" />
      <rect x="142" y="72" width="16" height="16" rx="1" />
      <rect x="120" y="94" width="16" height="16" rx="1" />
      <rect x="142" y="94" width="16" height="16" rx="1" />
    </g>

    <!-- Trazo Curvo Verde Inferior -->
    <path d="M38 128 C 95 116, 175 116, 210 126 C 170 120, 100 121, 46 130 Z" fill="#449d44" />
  </g>

  <!-- TIPOGRAFÍA: ASESORES INMOBILIARIOS & RENACER -->
  <g id="logotipo">
    <!-- Subtítulo: Asesores Inmobiliarios -->
    <text x="252" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="500" letter-spacing="4" fill="#58595b">
      Asesores Inmobiliarios
    </text>

    <!-- Marca: RENACER -->
    <text x="245" y="125" font-family="'Didot', 'Bodoni MT', 'Cinzel', 'Playfair Display', Georgia, serif" font-size="64" font-weight="bold" font-style="italic" letter-spacing="4" fill="#1b1c1e">
      RENACER
    </text>
  </g>
</svg>
